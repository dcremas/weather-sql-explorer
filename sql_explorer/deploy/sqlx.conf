# sql.dustincremascoli.com -- Weather Warehouse SQL Explorer (Streamlit).
#
# Install to /etc/nginx/conf.d/sqlx.conf. This is the post-certbot state; see
# sqlx-http.conf for the bootstrap half and README-deploy.md for the order.
#
# ------------------------------------------------------------------------------
# WHAT NGINX CAN AND CANNOT PROTECT HERE -- READ THIS BEFORE TUNING THE LIMITS
# ------------------------------------------------------------------------------
# This is the first PUBLIC, UNAUTHENTICATED vhost on this box that spends money
# per interaction. It is tempting to reason "limit_req caps the cost". IT DOES
# NOT, and believing it would leave the real hole open.
#
# Streamlit sends every user action over ONE long-lived WebSocket. A visitor
# loads the page (a burst of HTTP requests, which limit_req does see), and then
# asks twenty questions over that single already-established connection —
# generating ZERO further HTTP requests for limit_req to count. So:
#
#   limit_req  protects against page-load hammering and scraping.  Useful.
#   limit_conn protects against one IP opening many parallel sessions to
#              multiply its question allowance.  This is the useful lever.
#   The actual spend cap is IN THE APP: a per-session question limit and a
#              global daily token budget that fails closed (budget.py).
#
# If the LLM bill ever looks wrong, tune budget.py. Tuning the numbers in this
# file will not help.
#
# ------------------------------------------------------------------------------
# TWO WAYS THIS DIFFERS FROM analytics.conf, WHICH IS OTHERWISE ITS TEMPLATE
# ------------------------------------------------------------------------------
# 1. NO basic auth. This is a public showcase linked from the main site; a demo
#    nobody can try is not a demo. That is the whole reason the app-side caps and
#    the read-only database role exist.
#
# 2. IT DOES capture its own traffic (`weblog_json` access_log +
#    weblog-endpoint.inc), where analytics.conf deliberately does not. This is a
#    public page whose visitor numbers are worth having. It therefore ALSO needs
#    an entry in the `map $host $weblog_site` block in 00-weblog.conf — without
#    one, its hits land in the `other` bucket, which on this box means "scanner
#    hitting an unknown Host" and is a signal worth not polluting. provision.sh
#    adds that entry; if you rename the host, move it too.

# 20r/s, matching analytics.conf, and for the reason documented there: Streamlit
# is a JavaScript SPA that requests 60-100 chunked .js/.css files in one burst on
# first load. The 120r/m used by the Flask vhosts returned 429 for most of that
# burst, so core chunks never arrived and the page rendered blank with no visible
# error. Symptom to look for in sqlx.error.log:
#   "limiting requests, excess: ... by zone sqlx_all"
limit_req_zone $binary_remote_addr zone=sqlx_all:10m rate=20r/s;

# Concurrent WebSocket sessions per IP. THIS is the limit that bounds LLM spend
# from one source, because the per-session question cap is only meaningful if one
# visitor cannot hold many sessions at once. 4 is generous for a real person with
# a few tabs and still turns "12 questions per session" into a bounded number.
limit_conn_zone $binary_remote_addr zone=sqlx_conn:10m;

upstream sqlx_app {
    server 127.0.0.1:8503 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sql.dustincremascoli.com;

    # NOT OPTIONAL even though this block only redirects. A server block with no
    # access_log inherits the http-level weblog_json log from 00-weblog.conf.
    # Here capture IS wanted, so both lines are present deliberately — the plain
    # log for debugging, the JSON one for the pipeline. (Contrast analytics.conf,
    # where a single plain access_log is what SUPPRESSES capture.)
    access_log /var/log/nginx/sqlx.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sql.dustincremascoli.com;

    ssl_certificate     /etc/letsencrypt/live/sql.dustincremascoli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sql.dustincremascoli.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"                always;
    # Indexing is wanted here — it is a showcase. No X-Robots-Tag noindex,
    # unlike analytics.conf.

    client_max_body_size 1m;   # nothing is uploaded; questions are a few hundred bytes

    access_log /var/log/nginx/sqlx.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;
    error_log  /var/log/nginx/sqlx.error.log;

    # Streamlit's health endpoint. Returns the literal string "ok" and nothing
    # else; used by provision.sh and by any uptime check.
    location = /_stcore/health {
        proxy_pass http://sqlx_app;
        access_log off;
    }

    # The WebSocket carrying every UI update.
    #
    # limit_conn, NOT limit_req. A reconnect storm after a service restart would
    # trip a request limiter and lock every page out of recovering — the failure
    # mode analytics.conf documents. A CONNECTION limit does the useful thing
    # instead: it caps how many simultaneous sessions one IP can hold, which is
    # what bounds question volume from a single source.
    location /_stcore/stream {
        limit_conn sqlx_conn 4;
        limit_conn_status 429;
        include /etc/nginx/proxy_params_sqlx.inc;
    }

    # Streamlit's immutable build assets. Not rate limited: this is the 60-100
    # request burst that breaks the page, and it is the same chunks every load.
    # Unlike analytics.conf this vhost has no basic auth in front of it, so the
    # trade is deliberate — a burst of static chunk requests is cheap to serve
    # and costs nothing in LLM tokens, which is the thing actually worth
    # protecting.
    location /static/ {
        include /etc/nginx/proxy_params_sqlx.inc;
        access_log off;
    }

    location / {
        limit_req zone=sqlx_all burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_sqlx.inc;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
