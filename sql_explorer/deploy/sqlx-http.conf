# sql.dustincremascoli.com -- BOOTSTRAP vhost, HTTP only.
#
# Install to /etc/nginx/conf.d/sqlx.conf FIRST, so certbot has a webroot to
# answer the ACME challenge from, then run enable-tls.sh which replaces this file
# with sqlx.conf. Trying to install the TLS vhost first fails `nginx -t`: it
# references certificate files that do not exist yet.

upstream sqlx_app {
    server 127.0.0.1:8503 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sql.dustincremascoli.com;

    # See the long note in sqlx.conf: capture is wanted on this vhost, unlike the
    # analytics dashboard.
    access_log /var/log/nginx/sqlx.access.log;
    include /etc/nginx/weblog-endpoint.inc;
    access_log /var/log/weblog/access.json.log weblog_json buffer=32k flush=5s;
    error_log  /var/log/nginx/sqlx.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /_stcore/health {
        proxy_pass http://sqlx_app;
        access_log off;
    }

    location /_stcore/stream {
        include /etc/nginx/proxy_params_sqlx.inc;
    }

    location / {
        include /etc/nginx/proxy_params_sqlx.inc;
    }
}
