# The page's look, matched to PromptPace (~/projects/typing/app/static/styles.css): the same
# warm off-white, the same blue, the same dark palette. Streamlit picks light or dark from
# the visitor's OS setting when both sections are present, as PromptPace's CSS does.
#
# Read from the WORKING DIRECTORY's .streamlit/, which is /opt/sql-explorer on the box
# (sql-explorer.service) and this directory under run.sh. The rest of the styling -- the
# cards, the header, the footer -- is CSS in style.py, and uses these same values.
#
# Ask Football's file, value for value, since 2026-11-05 when this app took Ask
# Football's layout. One difference, on purpose: NO chartCategoricalColors. Every chart
# here is Plotly, drawn from theme.py with theme=None (constraint 1 in app.py), and
# setting Streamlit's chart colours would only mask a chart that lost theme=None by
# making it look nearly right. theme.py's surfaces equal the cards' (#fcfcfb / #1a1a19).

# INTER AND THE MAIN SITE'S BLUE (2026-10-12). The font is the main
# dustincremascoli.com site's Inter, served from ./static/fonts/ by static serving
# -- the same file, SIL OFL 1.1, licence beside it. Light primary and links take
# the main site's #0b6bcb / #0956a8, dark links its #8cc0ff. Dark primary stays
# #3987e5: Streamlit sets white text on primary buttons, and white on the main
# site's dark #61a8ff is 2.5:1. The chart colours are unchanged.

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"           # no Deploy button or developer menu on a public page

[theme]
font = "Inter Variable, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
codeFont = "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
baseRadius = "10px"
buttonRadius = "10px"
baseFontSize = 16
headingFontWeights = [700, 650, 600, 600, 600, 600]
showWidgetBorder = true

[[theme.fontFaces]]
family = "Inter Variable"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[theme.light]
primaryColor = "#0b6bcb"
backgroundColor = "#f6f5f2"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e2e0da"
linkColor = "#0956a8"
codeBackgroundColor = "#f0efec"
dataframeHeaderBackgroundColor = "#f0efec"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#121211"
secondaryBackgroundColor = "#232321"
textColor = "#ffffff"
borderColor = "#2e2e2b"
linkColor = "#8cc0ff"
codeBackgroundColor = "#1a1a19"
dataframeHeaderBackgroundColor = "#232321"
